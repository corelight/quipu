<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191f" />
      <stop offset="0.52" stop-color="#1b2027" />
      <stop offset="1" stop-color="#222831" />
    </linearGradient>
    <radialGradient id="purple-glow" cx="0" cy="0" r="1"
                    gradientTransform="translate(130 120) rotate(35) scale(560 430)"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9851c4" stop-opacity="0.22" />
      <stop offset="1" stop-color="#9851c4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="green-glow" cx="0" cy="0" r="1"
                    gradientTransform="translate(1160 570) rotate(-145) scale(620 430)"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77fb9d" stop-opacity="0.14" />
      <stop offset="1" stop-color="#77fb9d" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.025" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <rect width="1280" height="640" fill="url(#purple-glow)" />
  <rect width="1280" height="640" fill="url(#green-glow)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Quiet cord motif extending beyond the card edges. -->
  <g fill="none" stroke="#8a9099" stroke-linecap="round" opacity="0.11">
    <path d="M 835 -24 V 118" stroke-width="5" />
    <path d="M 1045 -24 V 92" stroke-width="5" />
    <path d="M 1180 -24 V 148" stroke-width="5" />
    <path d="M 760 82 H 1268" stroke-width="7" />
  </g>
  <g opacity="0.12">
    <polygon points="835,96 857,109 857,135 835,148 813,135 813,109" fill="#77fb9d" />
    <polygon points="1045,66 1067,79 1067,105 1045,118 1023,105 1023,79" fill="#9851c4" />
    <polygon points="1180,126 1202,139 1202,165 1180,178 1158,165 1158,139" fill="#77fb9d" />
  </g>

  <!-- Exact Quipu app-icon artwork, enlarged without raster scaling. -->
  <rect x="101" y="136" width="408" height="408" rx="90" fill="#05070a" opacity="0.32" />
  <g transform="translate(86 116) scale(4.08)">
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#23272e" />
    <rect x="0.7" y="0.7" width="98.6" height="98.6" rx="21.3" ry="21.3"
          fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.4" />
    <g transform="translate(50,50) scale(1.1) translate(-50,-52.5)">
      <g fill="none" stroke="#8a9099">
        <line x1="15" y1="20" x2="85" y2="20" stroke-width="5" stroke-linecap="round" />
        <line x1="30" y1="20" x2="30" y2="85" stroke-width="4" stroke-linecap="round" />
        <line x1="70" y1="20" x2="70" y2="85" stroke-width="4" stroke-linecap="round" />
        <line x1="50" y1="20.06102" x2="50" y2="46.078022" stroke-width="4" stroke-linecap="round" />
      </g>
      <line x1="50" y1="46.448433" x2="50" y2="77.92292" stroke="#77fb9d" stroke-width="4" />
      <line x1="50" y1="77.935928" x2="50" y2="84.787186" stroke="#8a9099"
            stroke-width="4" stroke-linecap="round" />
      <polygon points="30,35 36,38.5 36,45.5 30,49 24,45.5 24,38.5" fill="#9851c4" />
      <polygon points="50,45 56,48.5 56,55.5 50,59 44,55.5 44,48.5" fill="#77fb9d" />
      <polygon points="50,65 56,68.5 56,75.5 50,79 44,75.5 44,68.5" fill="#77fb9d" />
      <polygon points="70,55 76,58.5 76,65.5 70,69 64,65.5 64,58.5" fill="#9851c4" />
    </g>
  </g>

  <g font-family="Noto Sans, DejaVu Sans, sans-serif">
    <text x="560" y="276" fill="#f7f9fb" font-size="112" font-weight="700"
          letter-spacing="-4">Quipu</text>
    <rect x="566" y="307" width="84" height="6" rx="3" fill="#9851c4" />
    <rect x="650" y="307" width="118" height="6" rx="3" fill="#77fb9d" />
    <text x="562" y="375" fill="#cbd1d8" font-size="29" font-weight="400">
      A desktop workbench for writing,
    </text>
    <text x="562" y="422" fill="#cbd1d8" font-size="29" font-weight="400">
      validating, compiling, and testing YARA rules.
    </text>
  </g>

  <g transform="translate(562 477)" font-family="Noto Sans, DejaVu Sans, sans-serif">
    <rect width="124" height="46" rx="23" fill="#9851c4" fill-opacity="0.16"
          stroke="#9851c4" stroke-opacity="0.42" />
    <text x="62" y="30" text-anchor="middle" fill="#d8b7ec" font-size="19" font-weight="600">YARA-X</text>
    <g transform="translate(140 0)">
      <rect width="106" height="46" rx="23" fill="#77fb9d" fill-opacity="0.12"
            stroke="#77fb9d" stroke-opacity="0.38" />
      <text x="53" y="30" text-anchor="middle" fill="#b9f9cc" font-size="19" font-weight="600">Desktop</text>
    </g>
    <g transform="translate(262 0)">
      <rect width="154" height="46" rx="23" fill="#ffffff" fill-opacity="0.055"
            stroke="#ffffff" stroke-opacity="0.13" />
      <text x="77" y="30" text-anchor="middle" fill="#cbd1d8" font-size="19" font-weight="600">Open source</text>
    </g>
  </g>
</svg>
