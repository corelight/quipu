version: 2

# Tauri's JavaScript and Rust packages must be reviewed and built together.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: npm
    directory: /app
    patterns:
      - "@tauri-apps/*"
    multi-ecosystem-group: tauri

  - package-ecosystem: cargo
    directory: /app/src-tauri
    patterns:
      - "tauri"
      - "tauri-*"
    multi-ecosystem-group: tauri

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    # Route Tauri version updates to the cross-ecosystem group. These version
    # filters do not apply to security updates, which remain independently eligible.
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Monaco's 0.x minor releases can require editor/API migrations.
      monaco:
        patterns:
          - monaco-editor
      npm-minor-and-patch:
        exclude-patterns:
          - monaco-editor
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "tauri"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: "tauri-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Git-tag updates must stay together even when Dependabot cannot classify
      # their SemVer level. Do not add an update-types filter to this group.
      yara-x:
        patterns:
          - yara-x
          - yara-x-*
      cargo-minor-and-patch:
        exclude-patterns:
          - yara-x
          - yara-x-*
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
