name: Linux build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  YRX_REGENERATE_MODULES_RS: "false"

jobs:
  build:
    name: Test and package Linux x86-64
    # Build on the oldest GitHub-hosted Ubuntu image we support so the binary
    # does not acquire an unnecessarily new glibc requirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Install Zola
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: zola@0.23.6

      - name: Install native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            desktop-file-utils \
            cpio \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            python3-pil python3-xlib xclip xvfb

      - name: Check tag and application versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version="$(node -p "require('./app/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${app_version}"

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Install cargo-about
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-about@0.9.2

      - name: Fetch all locked Rust dependencies
        working-directory: app/src-tauri
        run: cargo fetch --locked

      - name: Verify third-party notices are current
        working-directory: app
        run: |
          npm run licenses:generate
          git diff --exit-code -- ../THIRD_PARTY_LICENSES/

      - name: Build AppImage, DEB, and RPM
        working-directory: app
        run: npm run tauri -- build --ci --bundles appimage,deb,rpm -- --locked

      - name: Validate package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="${GITHUB_WORKSPACE}/app/src-tauri/target/release/bundle"
          app_root="${bundle_root}/appimage/Quipu.AppDir"
          deb_packages=("${bundle_root}"/deb/*.deb)
          rpm_packages=("${bundle_root}"/rpm/*.rpm)
          test "${#deb_packages[@]}" -eq 1
          test "${#rpm_packages[@]}" -eq 1

          validation_root="$(mktemp -d)"
          mkdir "${validation_root}/deb" "${validation_root}/rpm"
          dpkg-deb --extract "${deb_packages[0]}" "${validation_root}/deb"
          (
            cd "${validation_root}/rpm"
            cpio --extract --make-directories --quiet \
              < <(rpm2cpio "${rpm_packages[0]}")
          )

          cmp LICENSE "${app_root}/usr/lib/Quipu/LICENSE"
          cmp THIRD_PARTY_LICENSES/NPM.txt \
            "${app_root}/usr/lib/Quipu/THIRD_PARTY_LICENSES/NPM.txt"
          cmp THIRD_PARTY_LICENSES/RUST.txt \
            "${app_root}/usr/lib/Quipu/THIRD_PARTY_LICENSES/RUST.txt"

          cmp LICENSE "${validation_root}/deb/usr/share/doc/quipu/copyright"
          cmp THIRD_PARTY_LICENSES/NPM.txt \
            "${validation_root}/deb/usr/share/doc/quipu/THIRD_PARTY_LICENSES_NPM.txt"
          cmp THIRD_PARTY_LICENSES/RUST.txt \
            "${validation_root}/deb/usr/share/doc/quipu/THIRD_PARTY_LICENSES_RUST.txt"

          cmp LICENSE "${validation_root}/rpm/usr/share/licenses/quipu/LICENSE"
          cmp THIRD_PARTY_LICENSES/NPM.txt \
            "${validation_root}/rpm/usr/share/licenses/quipu/THIRD_PARTY_LICENSES_NPM.txt"
          cmp THIRD_PARTY_LICENSES/RUST.txt \
            "${validation_root}/rpm/usr/share/licenses/quipu/THIRD_PARTY_LICENSES_RUST.txt"

          desktop-file-validate \
            "${app_root}/usr/share/applications/Quipu.desktop"
          desktop-file-validate \
            "${validation_root}/deb/usr/share/applications/Quipu.desktop"
          desktop-file-validate \
            "${validation_root}/rpm/usr/share/applications/Quipu.desktop"

          for binary in \
            "${app_root}/usr/bin/quipu" \
            "${validation_root}/deb/usr/bin/quipu" \
            "${validation_root}/rpm/usr/bin/quipu"
          do
            test -x "${binary}"
            if ldd "${binary}" | grep -F 'not found'; then
              exit 1
            fi
          done

      - name: Exercise Linux native menus
        timeout-minutes: 5
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 test/ui/menu_scenarios.py
          menu_shape about_dialog save_fires_once view_toggles_and_reset
          --server xvfb --mode release --artifacts /tmp/quipu-menu-smoke

      - name: Upload native menu diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-menu-smoke-diagnostics
          path: |
            /tmp/quipu-menu-smoke/
            /tmp/quipu-uitest.log
          retention-days: 14

      - name: Collect packages
        run: |
          mkdir dist
          cp app/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          cp app/src-tauri/target/release/bundle/deb/*.deb dist/
          cp app/src-tauri/target/release/bundle/rpm/*.rpm dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quipu-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
