name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux x86-64 packages
    uses: ./.github/workflows/linux-build.yml

  windows:
    name: Build Windows x86-64 packages
    uses: ./.github/workflows/windows-build.yml

  collect:
    name: Assemble packages and checksums
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quipu-*-x86_64
          merge-multiple: true
          path: dist

      - name: Generate combined checksums
        run: python3 scripts/release_manifest.py dist

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quipu-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  stage:
    name: Stage draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: collect
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download combined release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quipu-release
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --draft \
            --latest=false
