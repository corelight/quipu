name: Windows build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  YRX_REGENERATE_MODULES_RS: "false"

jobs:
  build:
    name: Test and package Windows x86-64
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri

      - name: Install Zola
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: zola@0.23.6

      - name: Check tag and application versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content app/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match app version $version" }

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Test frontend
        working-directory: app
        run: npm test

      - name: Build frontend and offline documentation
        working-directory: app
        run: npm run build

      - name: Lint Rust
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Build NSIS and MSI installers
        working-directory: app
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis,msi -- --locked

      - name: Validate installer contents
        run: ./app/scripts/validate-windows-packages.ps1

      - name: Collect standard packages before offline bundling replaces them
        run: |
          New-Item -ItemType Directory -Path dist/standard | Out-Null
          Copy-Item app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist/standard/
          Copy-Item app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist/standard/

      - name: Bundle offline NSIS and MSI installers with WebView2
        working-directory: app
        run: npm run tauri -- bundle --ci --target x86_64-pc-windows-msvc --bundles nsis,msi --config src-tauri/tauri.windows.offline.conf.json

      - name: Validate offline installer contents and embedded runtime
        run: ./app/scripts/validate-windows-packages.ps1 -Offline

      - name: Collect offline packages with distinct release filenames
        run: |
          New-Item -ItemType Directory -Path dist/offline | Out-Null
          $packages = Get-ChildItem app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe, app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          foreach ($package in $packages) {
            Copy-Item $package.FullName (Join-Path dist/offline "$($package.BaseName)-offline$($package.Extension)")
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quipu-windows-x86_64
          path: dist/standard/
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quipu-windows-offline-x86_64
          path: dist/offline/
          if-no-files-found: error
          retention-days: 14
