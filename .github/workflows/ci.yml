name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Zola
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: zola@0.23.6

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Build frontend and offline documentation
        working-directory: app
        run: npm run build

      - name: Install editor browser test dependencies
        run: |
          python3 -m venv /tmp/quipu-editor-venv
          /tmp/quipu-editor-venv/bin/python -m pip install playwright==1.59.0
          /tmp/quipu-editor-venv/bin/python -m playwright install --with-deps chromium

      - name: Exercise Monaco and the YARA LSP adapter
        run: /tmp/quipu-editor-venv/bin/python test/ui/editor_regression.py

      - name: Upload editor failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-regression-diagnostics
          path: /tmp/quipu-editor-regression-failure.png
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux x86-64
    uses: ./.github/workflows/linux-build.yml

  # Protect main requires the exact context "Rust". Keep it as a success-only
  # gate for the complete Linux workflow, including tests, smoke and packaging.
  rust:
    name: Rust
    needs: linux
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Linux validation to succeed
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$LINUX_RESULT" = success

  windows:
    name: Windows x86-64
    uses: ./.github/workflows/windows-build.yml

  macos:
    name: macOS (experimental)
    uses: ./.github/workflows/macos-build.yml

  harness:
    name: UI harness unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-pil python3-xlib

      - name: Test harness internals
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s test/ui -p '*_test.py' -v
