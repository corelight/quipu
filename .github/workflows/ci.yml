name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  YRX_REGENERATE_MODULES_RS: "false"

jobs:
  frontend:
    name: Frontend and documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Zola
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: zola@0.23.6

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Build frontend and offline documentation
        working-directory: app
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Set up Node.js for license inventory
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies for license inventory
        working-directory: app
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-about@0.9.2

      - name: Fetch all locked Rust dependencies
        working-directory: app/src-tauri
        run: cargo fetch --locked

      - name: Verify third-party notices are current
        working-directory: app
        run: |
          npm run licenses:generate
          git diff --exit-code -- ../THIRD_PARTY_LICENSES/

  windows:
    name: Windows x86-64
    uses: ./.github/workflows/windows-build.yml

  harness:
    name: UI harness unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-pil python3-xlib

      - name: Test harness internals
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s test/ui -p '*_test.py' -v
