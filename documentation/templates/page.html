{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}

    <p class="breadcrumb"><a href="{{ config.extra.embedded_base }}/index.html">Documentation</a> /</p>

    {{ page.content | safe }}
  </article>
{% endblock content %}
